# Somente desenvolvimento local. Senhas aqui sao descartaveis; em producao use cofre de segredos.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kronos
      POSTGRES_PASSWORD: kronos_dev
      POSTGRES_DB: kronos
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
