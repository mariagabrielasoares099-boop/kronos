{% extends "base.html" %}
{% block title %}Entrar - KRONOS{% endblock %}
{% block content %}
<div class="auth">
  <img class="mark" src="/static/img/kronos-mark.png" alt="" width="64" height="64">
  <h1>Acesso da equipe</h1>
  {% if erro %}<p class="alerta" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" action="/login">
    <label>E-mail
      <input type="email" name="email" value="{{ email }}" autocomplete="username" maxlength="320" required>
    </label>
    <label>Senha
      <input type="password" name="senha" autocomplete="current-password" maxlength="200" required>
    </label>
    <label>C&oacute;digo do autenticador (2FA)
      <input type="text" name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="10"{% if pede_2fa %} required autofocus{% endif %}>
    </label>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
