{% extends "base.html" %}
{% block title %}{{ vaga.titulo }} - KRONOS{% endblock %}
{% block content %}
<h1>{{ vaga.titulo }}</h1>
<p>{{ vaga.empresa }} &middot; {{ vaga.local }}</p>
<p>{{ vaga.descricao }}</p>

<h2>Candidatar-se</h2>
<form method="post" action="/vagas/{{ vaga.id }}/candidatar" class="form" novalidate>
  <label>Nome completo
    <input name="nome" value="{{ valores.nome or '' }}" maxlength="120" required autocomplete="name">
    {% if erros.nome %}<span class="erro">{{ erros.nome }}</span>{% endif %}
  </label>
  <label>E-mail
    <input name="email" type="email" value="{{ valores.email or '' }}" maxlength="320" required autocomplete="email">
    {% if erros.email %}<span class="erro">{{ erros.email }}</span>{% endif %}
  </label>
  <label>CPF
    <input name="cpf" value="{{ valores.cpf or '' }}" inputmode="numeric" maxlength="14" required
           hx-post="/validar/cpf" hx-trigger="change" hx-target="#cpf-status" hx-swap="innerHTML">
    <span id="cpf-status"></span>
    {% if erros.cpf %}<span class="erro">{{ erros.cpf }}</span>{% endif %}
  </label>
  <label class="check">
    <input type="checkbox" name="consentimento" required>
    Autorizo o tratamento dos meus dados para fins de recrutamento e admissao.
  </label>
  {% if erros.consentimento %}<span class="erro">{{ erros.consentimento }}</span>{% endif %}
  <button type="submit">Enviar candidatura</button>
</form>
{% endblock %}
